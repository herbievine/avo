# Avo on marvin — raw Docker behind the shared Caddy/cloudflared edge stack.
#
# Deploy: repo synced to ~/avo.herbievine.com on marvin, secrets in ./.env (mode 600),
# SQLite db + Enable Banking key in ./data (mounted at /data).
#   docker compose -f docker-compose.pi.yml up -d --build
name: avo

services:
  avo:
    build: .
    image: avo:local
    env_file: .env
    environment:
      DATABASE_URL: /data/avo.db
      ENABLE_BANKING_KEY_PATH: /data/enable-banking.pem
      # Sign-up is closed by default (everyone sees the same data). To add an
      # account: ALLOW_SIGNUP=true docker compose -f docker-compose.pi.yml up -d, then unset.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
    volumes:
      - ./data:/data
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login?mode=signin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Schema changes: `docker compose -f docker-compose.pi.yml run --rm migrate`
  # (reuses the build stage, which has bun + drizzle-kit).
  migrate:
    build:
      context: .
      target: build
    profiles: [tools]
    env_file: .env
    environment:
      DATABASE_URL: /data/avo.db
    volumes:
      - ./data:/data
    command: ['bun', 'run', 'db:push']

networks:
  edge:
    external: true
